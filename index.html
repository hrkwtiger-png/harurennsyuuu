<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="動物の特徴・生息地・食性・保全状況を、簡潔に検索・分類できる動物説明サイト（サンプル）。" />
  <title>動物図鑑（サンプル）</title>
  <style>
    :root{
      --bg: #0b1020;
      --panel: rgba(255,255,255,0.06);
      --panel2: rgba(255,255,255,0.09);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.68);
      --line: rgba(255,255,255,0.12);
      --accent: #7dd3fc;
      --accent2:#a78bfa;
      --good:#86efac;
      --warn:#fde68a;
      --bad:#fca5a5;

      --shadow: 0 14px 40px rgba(0,0,0,0.42);
      --radius: 16px;
      --radius2: 22px;
      --maxw: 1100px;

      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN",
              "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, Arial, sans-serif;
    }

    @media (prefers-color-scheme: light){
      :root{
        --bg:#f7f8fb;
        --panel: rgba(0,0,0,0.04);
        --panel2: rgba(0,0,0,0.07);
        --text: rgba(0,0,0,0.90);
        --muted: rgba(0,0,0,0.62);
        --line: rgba(0,0,0,0.10);
        --shadow: 0 14px 40px rgba(0,0,0,0.10);
      }
    }

    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      font-family:var(--font);
      color:var(--text);
      background:
        radial-gradient(900px 550px at 10% 0%, rgba(125,211,252,0.22), transparent 55%),
        radial-gradient(900px 550px at 95% 10%, rgba(167,139,250,0.18), transparent 60%),
        radial-gradient(900px 650px at 50% 100%, rgba(134,239,172,0.10), transparent 58%),
        var(--bg);
    }

    a{ color:inherit; text-decoration:none; }
    a:hover{ text-decoration:underline; }

    .wrap{ max-width:var(--maxw); margin:0 auto; padding:28px 18px 64px; }
    header{
      position:sticky; top:0;
      backdrop-filter: blur(10px);
      background: linear-gradient(to bottom, rgba(11,16,32,0.82), rgba(11,16,32,0.30));
      border-bottom:1px solid var(--line);
      z-index:10;
    }
    @media (prefers-color-scheme: light){
      header{ background: linear-gradient(to bottom, rgba(247,248,251,0.88), rgba(247,248,251,0.35)); }
    }

    .topbar{
      max-width:var(--maxw);
      margin:0 auto;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }

    .brand{
      display:flex; flex-direction:column; gap:2px;
      line-height:1.1;
    }
    .brand .title{
      font-weight:800;
      letter-spacing:0.02em;
    }
    .brand .sub{
      color:var(--muted);
      font-size:13px;
    }

    nav{
      display:flex; gap:10px; flex-wrap:wrap;
      align-items:center;
    }
    .navlink{
      padding:8px 10px;
      border:1px solid var(--line);
      border-radius:999px;
      background:var(--panel);
      font-size:13px;
      color:var(--muted);
    }
    .navlink:hover{ background:var(--panel2); color:var(--text); text-decoration:none; }

    .hero{
      margin-top:18px;
      padding:22px;
      border:1px solid var(--line);
      border-radius:var(--radius2);
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      box-shadow: var(--shadow);
    }
    .hero h1{
      margin:0 0 8px;
      font-size:26px;
      letter-spacing:0.01em;
    }
    .hero p{
      margin:0;
      color:var(--muted);
      max-width:74ch;
      line-height:1.65;
    }

    .controls{
      margin-top:16px;
      display:grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap:12px;
    }
    @media (max-width: 860px){
      .controls{ grid-template-columns: 1fr; }
    }

    .panel{
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:var(--panel);
      padding:14px;
    }

    .row{
      display:flex; gap:10px; flex-wrap:wrap;
      align-items:center;
    }

    .field{
      display:flex; flex-direction:column; gap:6px;
      min-width: 220px;
      flex: 1;
    }
    label{
      font-size:12px;
      color:var(--muted);
    }
    input[type="search"], select{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      padding:11px 12px;
      background: rgba(255,255,255,0.05);
      color:var(--text);
      outline:none;
    }
    @media (prefers-color-scheme: light){
      input[type="search"], select{ background: rgba(255,255,255,0.8); }
    }
    input[type="search"]::placeholder{ color: rgba(255,255,255,0.45); }
    @media (prefers-color-scheme: light){
      input[type="search"]::placeholder{ color: rgba(0,0,0,0.35); }
    }

    .chips{
      display:flex; gap:8px; flex-wrap:wrap;
      margin-top:10px;
    }
    .chip{
      border:1px solid var(--line);
      border-radius:999px;
      padding:7px 10px;
      font-size:13px;
      color:var(--muted);
      background: rgba(255,255,255,0.03);
      cursor:pointer;
      user-select:none;
    }
    .chip[aria-pressed="true"]{
      color:var(--text);
      border-color: rgba(125,211,252,0.55);
      background: rgba(125,211,252,0.14);
    }

    .meta{
      display:flex; justify-content:space-between; gap:10px;
      margin-top:10px;
      color:var(--muted);
      font-size:13px;
    }

    main{ margin-top:18px; }

    .grid{
      margin-top:14px;
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:12px;
    }
    @media (max-width: 980px){ .grid{ grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px){ .grid{ grid-template-columns: 1fr; } }

    .card{
      border:1px solid var(--line);
      border-radius:var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      padding:14px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.18);
    }
    @media (prefers-color-scheme: light){
      .card{ box-shadow: 0 10px 26px rgba(0,0,0,0.06); }
    }

    .cardhead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }
    .nameblock{ min-width: 0; }
    .jp{
      font-weight:800;
      margin:0;
      font-size:18px;
      letter-spacing:0.01em;
    }
    .latin{
      margin:3px 0 0;
      color:var(--muted);
      font-size:13px;
      overflow:hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badges{ display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
    .badge{
      font-size:12px;
      padding:6px 9px;
      border-radius:999px;
      border:1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color:var(--muted);
      white-space:nowrap;
    }
    .badge.type{ color:var(--text); border-color: rgba(167,139,250,0.35); background: rgba(167,139,250,0.12); }
    .badge.status-lc{ border-color: rgba(134,239,172,0.35); background: rgba(134,239,172,0.12); color:var(--text); }
    .badge.status-nt{ border-color: rgba(253,230,
